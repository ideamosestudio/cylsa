version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      fonts:
        patterns: ['@fontsource*/*']
      gltf:
        patterns: ['@gltf-transform/*', meshoptimizer]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
